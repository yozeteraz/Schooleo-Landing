<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schooleo — Demo Twojego kalendarza</title>
  <meta name="description" content="Wersja demonstracyjna Schooleo — zobacz, jak wygląda dzień Twojej szkoły.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@400&display=swap">
  <link rel="stylesheet" href="tokens.css">

  <style>
    /* ---------- Lokalne zmienne kalendarza (event colors) ---------- */
    :root {
      --font-family: var(--font-sans);
      --body-font: var(--font-body);
      --ev-1: #E84B20;  /* angielski */
      --ev-2: #2E7D63;  /* niemiecki */
      --ev-3: #C68B2E;  /* hiszpański */
      --ev-4: #5A6BAA;  /* francuski */
      --ev-5: #8B3A62;  /* matma / egzaminy */
      --ev-6: #6B8E23;  /* konwersacje / inne */
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100vh;
      font: var(--font-body);
      color: var(--text);
      background: var(--bg-warm);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    img, svg { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--color-orange-500); outline-offset: 2px; }

    /* =========================================================
       DEMO BANNER — 4 warianty (A/B/C/D)
       Wybierany przez body[data-banner-variant="X"]
       ========================================================= */
    .demo-banner { display: none; }
    body[data-banner-variant="a"] .demo-banner--a { display: block; }
    body[data-banner-variant="b"] .demo-banner--b { display: block; }
    body[data-banner-variant="c"] .demo-banner--c { display: flex; }
    body[data-banner-variant="d"] .demo-banner--d { display: inline-flex; }

    /* Wspólne elementy (pill, msg, cta) — używane wewnątrz wszystkich wariantów */
    .demo-banner__pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: var(--color-ink-900);
      color: var(--color-butter);
      font: 600 11px/1 var(--font-sans);
      letter-spacing: var(--tracking-eyebrow);
      text-transform: uppercase;
      border-radius: 999px;
      flex-shrink: 0;
    }
    .demo-banner__pill::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--color-orange-500);
    }
    .demo-banner__msg {
      flex: 1 1 auto;
      min-width: 0;
      font: 500 14px/1.45 var(--font-sans);
      color: var(--color-ink-900);
    }
    .demo-banner__msg b { font-weight: 700; }
    .demo-banner__msg .accent {
      background-image: linear-gradient(transparent 62%, rgba(232, 75, 32, 0.25) 62%, rgba(232, 75, 32, 0.25) 95%, transparent 95%);
      padding-inline: 0.1em;
    }
    .demo-banner__cta {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 18px;
      background: var(--color-orange-500);
      color: var(--color-paper);
      font: 700 14px/1 var(--font-sans);
      border-radius: 999px;
      box-shadow: 0 2px 0 var(--color-brick-900);
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
    }
    .demo-banner__cta:hover { transform: translateY(-1px); box-shadow: 0 3px 0 var(--color-brick-900); }
    .demo-banner__cta:active { transform: translateY(2px); box-shadow: 0 0 0 var(--color-brick-900); }

    /* ---------- Wariant A — sticky top, nad logo ---------- */
    .demo-banner--a {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--color-butter);
      border-bottom: 1px solid color-mix(in srgb, var(--color-orange-500) 12%, var(--color-butter));
      box-shadow: 0 1px 0 rgba(26, 23, 20, 0.04);
    }
    .demo-banner--a .demo-banner__inner {
      max-width: 1440px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    /* ---------- Wariant B — pod linią loga (in-flow, w kontenerze) ---------- */
    .demo-banner--b {
      max-width: 1440px;
      margin: 12px auto 4px;
      padding: 0 24px;
    }
    .demo-banner--b .demo-banner__inner {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      padding: 14px 18px 14px 20px;
      background: var(--color-butter);
      border-radius: 12px;
      border-left: 4px solid var(--color-orange-500);
      box-shadow: 0 1px 0 rgba(26, 23, 20, 0.04);
    }

    /* ---------- Wariant C — floating bottom-right (non-blocking) ---------- */
    .demo-banner--c {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 45;
      max-width: min(420px, calc(100vw - 48px));
      align-items: stretch;
      gap: 0;
      padding: 14px 16px;
      background: var(--color-paper);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 12px 32px -8px rgba(26, 23, 20, 0.18), 0 2px 0 rgba(26, 23, 20, 0.04);
      flex-direction: column;
    }
    .demo-banner--c .demo-banner__inner {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .demo-banner--c .demo-banner__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .demo-banner--c .demo-banner__msg {
      font-size: 13.5px;
      line-height: 1.45;
    }
    .demo-banner--c .demo-banner__cta {
      align-self: stretch;
      justify-content: center;
      padding: 10px 16px;
      font-size: 13px;
    }

    /* ---------- Wariant D — inline chip w toolbar kalendarza ---------- */
    .demo-banner--d {
      align-items: center;
      gap: 8px;
      padding: 0;
      background: transparent;
      border: 0;
    }
    .demo-banner--d .demo-banner__inner {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 28px;
      padding: 0 12px 0 4px;
      background: var(--color-butter);
      border: 1px solid color-mix(in srgb, var(--color-orange-500) 25%, var(--color-butter));
      border-radius: 999px;
      font: 600 12px/1 var(--font-sans);
      color: var(--color-ink-900);
    }
    .demo-banner--d .demo-banner__pill {
      padding: 3px 8px;
      font-size: 10px;
    }
    .demo-banner--d .demo-banner__msg {
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .demo-banner--d .demo-banner__msg b { font-weight: 700; }
    .demo-banner--d .demo-banner__cta {
      padding: 5px 10px;
      font-size: 11px;
      box-shadow: 0 1px 0 var(--color-brick-900);
      border-radius: 999px;
    }
    .demo-banner--d .demo-banner__cta:hover { box-shadow: 0 2px 0 var(--color-brick-900); }
    .demo-banner--d .demo-banner__cta:active { box-shadow: 0 0 0 var(--color-brick-900); }

    /* =========================================================
       VARIANT HARNESS — switcher pasków (bottom-LEFT, żeby nie
       kolidował z wariantem C w bottom-right)
       ========================================================= */
    .variant-harness {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 60;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px 12px;
      background: var(--color-paper);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 8px 24px -6px rgba(26, 23, 20, 0.16);
    }
    .variant-harness__row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .variant-harness__label {
      min-width: 80px;
      font: 600 10px/1 var(--font-sans);
      letter-spacing: var(--tracking-eyebrow);
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .variant-harness button {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-warm);
      font: 700 12px/1 var(--font-sans);
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .variant-harness button:hover { border-color: var(--border-strong); color: var(--text); }
    .variant-harness button.is-active {
      background: var(--color-orange-500);
      color: var(--color-paper);
      border-color: var(--color-orange-500);
    }
    @media (max-width: 640px) {
      .variant-harness { display: none; }
      .demo-banner--c { right: 16px; bottom: 16px; max-width: calc(100vw - 32px); }
    }

    /* =========================================================
       DEMO TOPBAR (logo + welcome + wyjście)
       ========================================================= */
    .demo-topbar {
      max-width: 1440px;
      margin: 0 auto;
      padding: 18px 24px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .demo-topbar__brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .demo-topbar__brand .logo-icon { width: 32px; height: 32px; }
    .demo-topbar__brand .logo-wordmark { height: 22px; width: auto; }
    .demo-topbar__greeting {
      flex: 1 1 auto;
      min-width: 0;
      padding: 0 24px;
      font: 500 14px/1.4 var(--font-sans);
      color: var(--text-muted);
    }
    .demo-topbar__greeting b { color: var(--text); font-weight: 700; }
    .demo-topbar__logout {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      font: 600 13px/1 var(--font-sans);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bg-surface);
      transition: var(--transition-fast);
    }
    .demo-topbar__logout:hover { color: var(--text); border-color: var(--border-strong); }
    .demo-topbar__logout svg { width: 14px; height: 14px; }

    /* =========================================================
       CALENDAR (kopia z course-form-preview.html, sekcja kalendarza)
       ========================================================= */
    .cal-shell {
      max-width: 1440px;
      margin: 0 auto;
      padding: var(--space-5) var(--space-6) var(--space-8);
      color: var(--text);
      font: var(--body-font);
    }
    .cal-toolbar {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: var(--space-5);
      padding-bottom: var(--space-4);
      border-bottom: 1px solid var(--border);
    }
    .cal-toolbar__date {
      font: 600 clamp(16px, 2vw, 22px)/1.2 var(--font-family);
      color: var(--text);
      text-align: right;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    .cal-toolbar__nav {
      display: flex;
      align-items: center;
      gap: 2px;
      justify-self: center;
    }
    .cal-toolbar__divider {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin: 0 var(--space-2);
    }
    .cal-nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .cal-nav-btn:hover { background: var(--bg-subtle); color: var(--text); }
    .cal-nav-btn svg { width: 16px; height: 16px; }
    .cal-today {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text);
      font: 500 13px/1 var(--font-family);
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .cal-today:hover { border-color: var(--border-strong); background: var(--bg-subtle); }
    .cal-today svg { width: 14px; height: 14px; color: var(--text-muted); }

    .cal-seg {
      display: inline-flex;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 2px;
      gap: 2px;
    }
    .cal-seg button {
      padding: 6px 14px;
      border-radius: calc(var(--radius-sm) - 2px);
      border: 0;
      background: transparent;
      color: var(--text-muted);
      font: 500 13px/1 var(--font-family);
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .cal-seg button[aria-selected="true"] {
      background: var(--bg-surface);
      color: var(--text);
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }

    .cal-filters {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-3) 0;
      flex-wrap: wrap;
    }
    .cal-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 10px;
      border-radius: var(--radius-sm);
      background: transparent;
      border: 1px dashed var(--border-strong);
      color: var(--text-muted);
      font: 500 12px/1 var(--font-family);
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .cal-chip:hover { background: var(--bg-subtle); color: var(--text); border-style: solid; }
    .cal-chip--solid { border-style: solid; background: var(--bg-subtle); color: var(--text); }
    .cal-chip--solid .cal-chip__x { color: var(--text-subtle); margin-left: 2px; }
    /* Branch picker (enterprise only) — wygląda jak chip z dropdown caret */
    .cal-chip--branch {
      border-style: solid;
      background: var(--color-paper);
      color: var(--text);
      font-weight: 700;
      border-color: var(--border-strong);
    }
    .cal-chip--branch::after {
      content: '';
      display: inline-block;
      margin-left: 2px;
      width: 0; height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid var(--text-muted);
    }
    body[data-tier="enterprise"] .cal-branch-only { display: inline-flex; }
    .cal-branch-only { display: none; }

    .cal-grid-wrap {
      position: relative;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      overflow: auto;
      max-height: calc(100vh - 280px);
      min-height: 560px;
    }

    .cal-grid {
      display: flex;
      flex-direction: column;
      min-width: max-content;
    }

    .cal-head {
      display: flex;
      position: sticky;
      top: 0;
      z-index: 4;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
    }
    .cal-head__corner {
      flex: 0 0 56px;
      position: sticky;
      left: 0;
      z-index: 5;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
    }
    .cal-head__room {
      flex: 1 1 180px;
      min-width: 180px;
      padding: 10px 12px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-align: center;
      align-items: center;
    }
    .cal-head__room:last-child { border-right: 0; }
    .cal-head__room-num {
      font: 600 14px/1.2 var(--font-family);
      color: var(--text);
    }
    .cal-head__room-name {
      font: 400 11px/1.2 var(--font-family);
      color: var(--text-muted);
    }

    .cal-body {
      display: flex;
      position: relative;
    }
    .cal-times {
      flex: 0 0 56px;
      position: sticky;
      left: 0;
      z-index: 3;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
    }
    .cal-hour {
      height: 60px;
      padding: 4px 8px 0 0;
      border-bottom: 1px solid var(--border);
      font: 600 12px/1.2 var(--font-family);
      color: var(--text-muted);
      text-align: right;
    }
    .cal-hour:last-child { border-bottom: 0; }

    .cal-cols {
      display: flex;
      flex: 1 1 auto;
      position: relative;
    }
    .cal-col {
      flex: 1 1 180px;
      min-width: 180px;
      position: relative;
      border-right: 1px solid var(--border);
      background:
        repeating-linear-gradient(to bottom,
          transparent 0,
          transparent 59px,
          var(--border) 59px,
          var(--border) 60px);
    }
    .cal-col:last-child { border-right: 0; }

    .cal-event {
      position: absolute;
      left: 3px;
      right: 3px;
      padding: 4px 6px 4px 9px;
      border-radius: var(--radius-sm);
      background: color-mix(in srgb, var(--ev-color) 16%, var(--bg-surface));
      border-left: 3px solid var(--ev-color);
      color: var(--text);
      overflow: hidden;
      cursor: pointer;
      transition: var(--transition-fast);
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .cal-event:hover {
      background: color-mix(in srgb, var(--ev-color) 24%, var(--bg-surface));
      z-index: 2;
    }
    .cal-event[data-c="1"] { --ev-color: var(--ev-1); }
    .cal-event[data-c="2"] { --ev-color: var(--ev-2); }
    .cal-event[data-c="3"] { --ev-color: var(--ev-3); }
    .cal-event[data-c="4"] { --ev-color: var(--ev-4); }
    .cal-event[data-c="5"] { --ev-color: var(--ev-5); }
    .cal-event[data-c="6"] { --ev-color: var(--ev-6); }
    .cal-event__time {
      font: 600 11px/1.2 var(--font-family);
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cal-event__time em {
      font-style: normal;
      font-weight: 400;
      color: var(--text-muted);
    }
    .cal-event__title {
      font: 600 12px/1.25 var(--font-family);
      color: var(--text);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .cal-event__meta {
      font: 400 11px/1.25 var(--font-family);
      color: var(--text-muted);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    @media (max-width: 960px) {
      .cal-shell { padding: var(--space-4) var(--space-4) var(--space-6); }
      .cal-toolbar {
        grid-template-columns: 1fr 1fr;
        gap: var(--space-3);
      }
      .cal-toolbar__date { grid-column: 1 / -1; text-align: left; order: -1; }
      .cal-toolbar__nav { justify-self: start; }
    }
    @media (max-width: 640px) {
      .demo-banner__inner { padding: 10px 16px; gap: 12px; }
      .demo-banner__msg { font-size: 13px; flex: 1 1 100%; order: 2; }
      .demo-banner__pill { order: 1; }
      .demo-banner__cta { order: 3; padding: 8px 14px; font-size: 13px; }
      .demo-topbar { padding: 14px 16px 4px; }
      .demo-topbar__greeting { display: none; }
      .cal-shell { padding: var(--space-3); }
      .cal-toolbar { grid-template-columns: 1fr; }
      .cal-toolbar__nav { flex-wrap: wrap; }
      .cal-head__room { flex-basis: 140px; min-width: 140px; padding: 6px 8px; }
      .cal-col { flex-basis: 140px; min-width: 140px; }
      .cal-times, .cal-head__corner { flex-basis: 42px; }
      .cal-grid-wrap { max-height: calc(100vh - 280px); }
    }
  </style>
</head>
<body>

  <!-- ============ DEMO BANNER · WARIANT A — sticky top, nad logo ============ -->
  <div class="demo-banner demo-banner--a" role="region" aria-label="Informacja o wersji demo">
    <div class="demo-banner__inner">
      <span class="demo-banner__pill">Demo</span>
      <p class="demo-banner__msg" data-banner-msg>Twoja skala: <b>—</b></p>
      <a class="demo-banner__cta" data-banner-cta href="index.html#cennik">Wykup pakiet →</a>
    </div>
  </div>

  <!-- ============ DEMO TOPBAR ============ -->
  <header class="demo-topbar">

      // ============ Renderer kalendarza (skopiowany ze wzorca course-form-preview) ============
      const CAL_START = 13;
      const CAL_END   = 21;
      const CAL_HOURS = CAL_END - CAL_START;
      const CAL_PX    = 60;

      const toMin = (hhmm) => {
        const [h, m] = hhmm.split(':').map(Number);
        return (h - CAL_START) * 60 + m;
      };
      const pxPerMin = () => CAL_PX / 60;

      function assignColumns(evs) {
        evs.sort((a, b) => toMin(a.s) - toMin(b.s));
        evs.forEach(ev => {
          const aS = toMin(ev.s), aE = toMin(ev.e);
          for (let col = 0; ; col++) {
            const conflict = evs.some(o =>
              o !== ev && o._col === col &&
              toMin(o.s) < aE && toMin(o.e) > aS
            );
            if (!conflict) { ev._col = col; break; }
          }
        });
        return evs.reduce((mx, e) => Math.max(mx, e._col), 0) + 1;
      }

      function renderCalendar() {
        const grid = document.getElementById('cal-grid');
        if (!grid) return;
        grid.innerHTML = '';

        // header
        const head = document.createElement('div');
        head.className = 'cal-head';
        head.innerHTML = `<div class="cal-head__corner"></div>` +

            <div class="cal-head__room">
              <span class="cal-head__room-num">${r.n}</span>
              <span class="cal-head__room-name">${escapeHtml(r.name)}</span>
            </div>`).join('');
        grid.appendChild(head);

        // body
        const body = document.createElement('div');
        body.className = 'cal-body';

        const times = document.createElement('div');
        times.className = 'cal-times';
        for (let h = CAL_START; h < CAL_END; h++) {
          const hr = document.createElement('div');
          hr.className = 'cal-hour';
          hr.textContent = h;
          times.appendChild(hr);
        }
        body.appendChild(times);

        const cols = document.createElement('div');
        cols.className = 'cal-cols';
        cols.style.height = (CAL_HOURS * CAL_PX) + 'px';

        rooms.forEach(r => {
          const col = document.createElement('div');
          col.className = 'cal-col';
          col.dataset.room = r.n;

          const roomEvents = events.filter(e => e.r === r.n).map(e => ({ ...e }));
          const nCols = assignColumns(roomEvents);

          roomEvents.forEach(ev => {
            const top = toMin(ev.s) * pxPerMin();
            const h = (toMin(ev.e) - toMin(ev.s)) * pxPerMin();
            const widthPct = 100 / nCols;
            const leftPct = widthPct * ev._col;

            const el = document.createElement('div');
            el.className = 'cal-event';
            el.dataset.c = ev.c;
            el.style.cssText = `
              top: ${top}px;
              height: ${h - 2}px;
              left: calc(${leftPct}% + 3px);
              width: calc(${widthPct}% - 6px);
            `;
            el.innerHTML = `
              <div class="cal-event__time">${ev.s}–${ev.e} <em>· ${escapeHtml(ev.k)}</em></div>
              <div class="cal-event__title">${escapeHtml(ev.t)}</div>
              <div class="cal-event__meta">${escapeHtml(r.name)}</div>
            `;
            col.appendChild(el);
          });

          cols.appendChild(col);
        });
        body.appendChild(cols);
        grid.appendChild(body);
      }

      renderCalendar();
    })();
  </script>

        document.body.setAttribute('data-banner-variant', v);
        try { localStorage.setItem(KEY, v); } catch (e) {}
        document.querySelectorAll('.variant-harness button[data-banner-variant]').forEach(btn => {
          btn.classList.toggle('is-active', btn.dataset.bannerVariant === v);
        });
      };
      const saved = localStorage.getItem(KEY);
      setBannerVariant(VARIANTS.includes(saved) ? saved : 'a');
    })();
  </script>
</body>
</html>
