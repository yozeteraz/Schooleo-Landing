<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eyebrow preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --brand: #E84B20;
      --text:  #1A1714;
      --muted: #6B6560;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: #fff;
      padding: 80px 60px;
      display: flex;
      flex-direction: column;
      gap: 72px;
    }
    .option { display: flex; flex-direction: column; gap: 20px; }
    .label {
      font-size: 11px;
      font-weight: 600;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    h1 {
      font-size: 64px;
      font-weight: 800;
      letter-spacing: -0.06em;
      line-height: 1.05;
      color: var(--text);
    }

    .eyebrow {
      font-size: 11px;
      color: var(--brand);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .w300 { font-weight: 300; }
    .w400 { font-weight: 400; }
    .w500 { font-weight: 500; }
  </style>
</head>
<body>

  <div class="option">
    <p class="label">300 — najcieńszy</p>
    <p class="eyebrow w300">Dla szkół prywatnych i freelancerów</p>
    <h1>Zarządzaj szkołą<br>bez chaosu</h1>
  </div>

  <div class="option">
    <p class="label">400 — regular</p>
    <p class="eyebrow w400">Dla szkół prywatnych i freelancerów</p>
    <h1>Zarządzaj szkołą<br>bez chaosu</h1>
  </div>

  <div class="option">
    <p class="label">500 — medium (obecny)</p>
    <p class="eyebrow w500">Dla szkół prywatnych i freelancerów</p>
    <h1>Zarządzaj szkołą<br>bez chaosu</h1>
  </div>

</body>
</html>
