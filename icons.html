<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schooleo — ikony (aktualna vs iOS)</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--color-paper);
      color: var(--text);
      font: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    /* Topbar */
    .top {
      padding: 24px 24px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--color-paper);
      position: sticky; top: 0; z-index: 10;
    }
    .top__inner { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; gap: 18px; }
    .top__kicker {
      font-family: var(--font-accent);
      font-size: 28px;
      font-weight: 700;
      color: var(--color-orange-500);
      transform: rotate(-2deg);
      display: inline-block;
      line-height: 1;
    }
    .top h1 {
      font: 800 22px/1.2 var(--font-sans);
      margin: 0;
      letter-spacing: -0.01em;
    }
    .top__action {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: var(--text);
      color: var(--color-white);
      font: 600 13px/1 var(--font-sans);
      border: 0;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background var(--transition-fast);
    }
    .top__action:hover { background: #000; }
    .top__action svg { width: 14px; height: 14px; }

    main { max-width: 1400px; margin: 0 auto; padding: 18px 24px 60px; }

    .group { margin-bottom: 26px; }
    .group__head {
      display: flex;
      align-items: baseline;
      justify-content: flex-start;
      gap: 10px;
      margin: 18px 0 10px;
    }
    .group__head h2 {
      font: 700 13px/1 var(--font-sans);
      margin: 0;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .group__head__count {
      font: 500 11px/1 var(--font-sans);
      color: var(--text-subtle);
    }
    .group__head__line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Siatka kart */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 8px;
    }

    /* Karta ikony — sama nazwa + sizes w pionie */
    .card {
      display: grid;
      gap: 14px;
      padding: 16px 16px 18px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--color-white);
      position: relative;
    }
    .card__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card__name {
      font: 500 12px/1.3 var(--font-mono, ui-monospace, 'SF Mono', Menlo, monospace);
      letter-spacing: -0.005em;
      margin: 0;
      color: var(--text);
      font-feature-settings: 'tnum';
    }
    .card__dl {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      background: transparent;
      border: 0;
      color: var(--text-subtle);
      cursor: pointer;
      transition: background var(--transition-fast), color var(--transition-fast);
    }
    .card__dl:hover { background: var(--bg-subtle); color: var(--text); }
    .card__dl svg { width: 12px; height: 12px; }

    /* Compare = 2-col grid: rozmiar | ikona */
    .compare {
      display: grid;
      grid-template-columns: 32px 1fr;
      column-gap: 10px;
      row-gap: 10px;
      align-items: center;
    }
    .compare__size {
      font: 500 10px/1 var(--font-sans);
      color: var(--text-subtle);
      text-align: right;
      padding-right: 2px;
      font-feature-settings: 'tnum';
    }
    .compare__cell {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      color: var(--text);
      border-radius: 4px;
    }
    .compare__cell svg { display: block; }

    @media (max-width: 760px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    }
  </style>
</head>
<body>

  <header class="top">
    <div class="top__inner">
      <span class="top__kicker">Ikony</span>
      <h1>Schooleo · iOS</h1>
      <button class="top__action" data-download-all type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 4v12M6 10l6 6 6-6"/><path d="M4 20h16"/>
        </svg>
        Pobierz wszystkie (.zip)
      </button>
    </div>
  </header>

  <main>
    <div id="root"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <script>
    // ====================================================================
    // Propozycja iOS: vb 24, sw 1.8, round caps — JEDEN styl dla wszystkiego.
    // Aktualne: takie jak teraz w kodzie (różne).
    // ====================================================================
    const P_VB = '0 0 24 24';
    const P_SW = 1.8;

    const ICONS = [
      // ============ NAVIGATION ============
      { group: 'Navigation', name: 'chevron-down',         icon: { vb: P_VB, sw: P_SW, paths: ['M6 9l6 6 6-6'] } },
      { group: 'Navigation', name: 'chevron-right',        icon: { vb: P_VB, sw: P_SW, paths: ['M9 6l6 6-6 6'] } },
      { group: 'Navigation', name: 'chevron-left',         icon: { vb: P_VB, sw: P_SW, paths: ['M15 6l-6 6 6 6'] } },
      { group: 'Navigation', name: 'chevron-double-left',  icon: { vb: P_VB, sw: P_SW, paths: ['M13 6l-6 6 6 6M19 6l-6 6 6 6'] } },
      { group: 'Navigation', name: 'chevron-double-right', icon: { vb: P_VB, sw: P_SW, paths: ['M11 6l6 6-6 6M5 6l6 6-6 6'] } },

      // ============ ACTIONS ============
      { group: 'Actions', name: 'plus',      icon: { vb: P_VB, sw: P_SW, paths: ['M12 5v14M5 12h14'] } },
      { group: 'Actions', name: 'xmark',     icon: { vb: P_VB, sw: P_SW, paths: ['M6 6l12 12M18 6L6 18'] } },
      { group: 'Actions', name: 'trash',     icon: { vb: P_VB, sw: P_SW, paths: ['M4 7h16', 'M10 4h4a1 1 0 0 1 1 1v2H9V5a1 1 0 0 1 1-1z', 'M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13', 'M10 11v7M14 11v7'] } },
      { group: 'Actions', name: 'checkmark', icon: { vb: P_VB, sw: P_SW, paths: ['M5 12.5l5 5L19 7'] } },

      // ============ OBJECTS ============
      { group: 'Objects', name: 'calendar', icon: { vb: P_VB, sw: P_SW, paths: ['M3 10h18', 'M8 3v4M16 3v4'], rects: [{ x: 3, y: 5, w: 18, h: 16, rx: 2.5 }] } },
      { group: 'Objects', name: 'clock',    icon: { vb: P_VB, sw: P_SW, paths: ['M12 7v5l3.5 2'], circles: [{ cx: 12, cy: 12, r: 9 }] } },
      { group: 'Objects', name: 'phone',    icon: { vb: P_VB, sw: P_SW, paths: ['M5.5 4.5C5.5 3.95 5.95 3.5 6.5 3.5h2.36a1 1 0 0 1 .97.76l1.07 4.29a1 1 0 0 1-.27.95L8.86 11.18a13 13 0 0 0 5.96 5.96l1.68-1.77a1 1 0 0 1 .95-.27l4.29 1.07a1 1 0 0 1 .76.97V19.5c0 .55-.45 1-1 1H19.5C11.77 20.5 4.5 13.23 4.5 5.5z'] } },
      { group: 'Objects', name: 'envelope', icon: { vb: P_VB, sw: P_SW, paths: ['M3 8l9 6 9-6'], rects: [{ x: 3, y: 5, w: 18, h: 14, rx: 2 }] } },
      { group: 'Objects', name: 'bolt',     icon: { vb: P_VB, sw: P_SW, paths: ['M13 3L4 14h7l-1 7 9-11h-7l1-7z'] } },

      // ============ META ============
      { group: 'Meta', name: 'info-circle',     icon: { vb: P_VB, sw: P_SW, paths: ['M12 10.5v6', 'M12 7.5h.01'], circles: [{ cx: 12, cy: 12, r: 9 }] } },
      { group: 'Meta', name: 'question-circle', icon: { vb: P_VB, sw: P_SW, paths: ['M9.5 9.5a2.5 2.5 0 0 1 5 0c0 1.5-2.5 2-2.5 4', 'M12 17.5v.01'], circles: [{ cx: 12, cy: 12, r: 9 }] } },
      { group: 'Meta', name: 'filter',          icon: { vb: P_VB, sw: P_SW, paths: ['M4 6h16M7 12h10M10 18h4'] } }
    ];

    // ====================================================================
    // Renderer
    // ====================================================================
    const buildSvg = (def, displaySize) => {
      const { vb, sw, paths = [], circles = [], rects = [] } = def;
      let inner = '';
      paths.forEach(d => inner += `<path d="${d}"/>`);
      circles.forEach(c => inner += `<circle cx="${c.cx}" cy="${c.cy}" r="${c.r}"/>`);
      rects.forEach(r => inner += `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="${r.rx ?? 0}"/>`);
      return `<svg width="${displaySize}" height="${displaySize}" viewBox="${vb}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
    };

    const SIZES = [12, 16, 24];

    const compareBlock = (icon) => `
      <div class="compare">
        ${SIZES.map(s => `
          <div class="compare__size">${s}px</div>
          <div class="compare__cell">${buildSvg(icon.icon, s)}</div>
        `).join('')}
      </div>
    `;

    const card = (icon) => `
      <article class="card">
        <div class="card__head">
          <h3 class="card__name">${icon.name}</h3>
          <button class="card__dl" type="button" data-dl="${icon.name}" aria-label="Pobierz ${icon.name}.svg" title="Pobierz ${icon.name}.svg">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 4v12M6 10l6 6 6-6"/><path d="M4 20h16"/>
            </svg>
          </button>
        </div>
        ${compareBlock(icon)}
      </article>
    `;

    // ====================================================================
    // Eksport SVG — pojedyncze pliki + zip
    // ====================================================================
    const buildExportSvg = (def) => {
      const { vb, sw, paths = [], circles = [], rects = [] } = def;
      let inner = '';
      paths.forEach(d => inner += `\n  <path d="${d}"/>`);
      circles.forEach(c => inner += `\n  <circle cx="${c.cx}" cy="${c.cy}" r="${c.r}"/>`);
      rects.forEach(r => inner += `\n  <rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="${r.rx ?? 0}"/>`);
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${inner}\n</svg>\n`;
    };

    const downloadBlob = (filename, content, mime = 'image/svg+xml') => {
      const blob = content instanceof Blob ? content : new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };

    // ====================================================================
    // Wiring
    // ====================================================================

    const groups = {};
    ICONS.forEach(i => {
      groups[i.group] = groups[i.group] || [];
      groups[i.group].push(i);
    });

    const root = document.getElementById('root');
    Object.entries(groups).forEach(([groupName, items]) => {
      const section = document.createElement('section');
      section.className = 'group';
      section.innerHTML = `
        <div class="group__head">
          <h2>${groupName}</h2>
          <span class="group__head__count">${items.length}</span>
          <span class="group__head__line"></span>
        </div>
        <div class="grid">${items.map(card).join('')}</div>
      `;
      root.appendChild(section);
    });

    // Pojedynczy download
    root.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-dl]');
      if (!btn) return;
      const name = btn.dataset.dl;
      const icon = ICONS.find(i => i.name === name);
      if (!icon) return;
      downloadBlob(`${name}.svg`, buildExportSvg(icon.icon));
    });

    // Download all jako .zip
    document.querySelector('[data-download-all]').addEventListener('click', async () => {
      if (typeof JSZip === 'undefined') {
        // fallback — JSZip nie wczytany; ściągamy pojedynczo z opóźnieniem
        for (const icon of ICONS) {
          downloadBlob(`${icon.name}.svg`, buildExportSvg(icon.icon));
          await new Promise(r => setTimeout(r, 80));
        }
        return;
      }
      const zip = new JSZip();
      ICONS.forEach(icon => zip.file(`${icon.name}.svg`, buildExportSvg(icon.icon)));
      // jako bonus — sprite z wszystkimi <symbol> dla łatwego użycia w HTML
      const sprite = `<svg xmlns="http://www.w3.org/2000/svg" style="display:none">\n${ICONS.map(i => {
        const def = i.icon;
        let inner = '';
        (def.paths || []).forEach(d => inner += `<path d="${d}"/>`);
        (def.circles || []).forEach(c => inner += `<circle cx="${c.cx}" cy="${c.cy}" r="${c.r}"/>`);
        (def.rects || []).forEach(r => inner += `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="${r.rx ?? 0}"/>`);
        return `  <symbol id="${i.name}" viewBox="${def.vb}" fill="none" stroke="currentColor" stroke-width="${def.sw}" stroke-linecap="round" stroke-linejoin="round">${inner}</symbol>`;
      }).join('\n')}\n</svg>\n`;
      zip.file('_sprite.svg', sprite);
      const blob = await zip.generateAsync({ type: 'blob' });
      downloadBlob('schooleo-icons.zip', blob, 'application/zip');
    });
  </script>

</body>
</html>
