<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schooleo — Ikony</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lato:wght@800&display=swap">
  <link rel="stylesheet" href="tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--color-paper);
      color: var(--text);
      font: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    a { text-decoration: none; color: inherit; }

    /* Brand bar — fixed na górze, paper bg, spójny z hub/docs/dla-webdev */
    .brand {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 16px 40px 14px;
      z-index: 20;
      display: flex; align-items: center; gap: 14px;
      pointer-events: none;
      background: var(--color-paper);
      border-bottom: 1px solid var(--border);
    }
    .brand__wordmark {
      display: inline-flex; align-items: center;
      height: 24px;
      pointer-events: auto;
    }
    .brand__wordmark__svg { height: 100%; width: auto; display: block; }
    .brand__back {
      display: inline-flex; align-items: center; gap: 6px;
      font: 500 13px/1 var(--font-sans);
      color: var(--text-muted);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      pointer-events: auto;
      transition: color var(--transition-fast), background var(--transition-fast);
    }
    .brand__back:hover { color: var(--text); background: var(--bg-subtle); }
    .brand__back svg { width: 14px; height: 14px; }
    .top__action {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: var(--text);
      color: var(--color-white);
      font: 600 13px/1 var(--font-sans);
      border: 0;
      border-radius: var(--radius-sm);
      cursor: pointer;
      pointer-events: auto;
      transition: background var(--transition-fast);
    }
    .top__action:hover { background: #000; }
    .top__action svg { width: 14px; height: 14px; }

    main { max-width: 1400px; margin: 0 auto; padding: 92px 40px 80px; }

    .group { margin-bottom: 26px; }
    .group__head {
      display: flex;
      align-items: baseline;
      justify-content: flex-start;
      gap: 10px;
      margin: 18px 0 10px;
    }
    .group__head h2 {
      font: 700 13px/1 var(--font-sans);
      margin: 0;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .group__head__count {
      font: 500 11px/1 var(--font-sans);
      color: var(--text-subtle);
    }
    .group__head__line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Siatka kart */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 8px;
    }

    /* Karta ikony — sama nazwa + sizes w pionie */
    .card {
      display: grid;
      gap: 14px;
      padding: 16px 16px 18px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--color-white);
      position: relative;
    }
    .card__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card__name {
      font: 500 12px/1.3 var(--font-mono, ui-monospace, 'SF Mono', Menlo, monospace);
      letter-spacing: -0.005em;
      margin: 0;
      color: var(--text);
      font-feature-settings: 'tnum';
    }
    .card__dl {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      background: transparent;
      border: 0;
      color: var(--text-subtle);
      cursor: pointer;
      transition: background var(--transition-fast), color var(--transition-fast);
    }
    .card__dl:hover { background: var(--bg-subtle); color: var(--text); }
    .card__dl svg { width: 12px; height: 12px; }

    /* Compare = 2-col grid: rozmiar | ikona */
    .compare {
      display: grid;
      grid-template-columns: 32px 1fr;
      column-gap: 10px;
      row-gap: 10px;
      align-items: center;
    }
    .compare__size {
      font: 500 10px/1 var(--font-sans);
      color: var(--text-subtle);
      text-align: right;
      padding-right: 2px;
      font-feature-settings: 'tnum';
    }
    .compare__cell {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      color: var(--text);
      border-radius: 4px;
    }
    .compare__cell svg { display: block; }

    @media (max-width: 760px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    }
  
    .group__desc {
      font: 400 13px/1.5 var(--font-sans);
      color: var(--text-muted);
      max-width: 720px;
      margin: 0 0 14px;
    }
  </style>
</head>

    };

    const SIZES = [12, 16, 24];

    const compareBlock = (icon) => `
      <div class="compare">
        ${SIZES.map(s => `
          <div class="compare__size">${s}px</div>
          <div class="compare__cell">${buildSvg(icon.icon, s)}</div>
        `).join('')}
      </div>
    `;

    const card = (icon) => `
      <article class="card">
        <div class="card__head">
          <h3 class="card__name">${icon.name}</h3>
          <button class="card__dl" type="button" data-dl="${icon.name}" aria-label="Pobierz ${icon.name}.svg" title="Pobierz ${icon.name}.svg">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 4v12M6 10l6 6 6-6"/><path d="M4 20h16"/>
            </svg>
          </button>
        </div>
        ${compareBlock(icon)}
      </article>
    `;

    // ====================================================================
    // Eksport SVG — pojedyncze pliki + zip
    // ====================================================================
    const buildExportSvg = (def) => {
      const { vb, sw, paths = [], circles = [], rects = [] } = def;
      let inner = '';
      paths.forEach(d => inner += `\n  <path d="${d}"/>`);
      circles.forEach(c => inner += `\n  <circle cx="${c.cx}" cy="${c.cy}" r="${c.r}"/>`);
      rects.forEach(r => inner += `\n  <rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="${r.rx ?? 0}"/>`);
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${inner}\n</svg>\n`;
    };

    const downloadBlob = (filename, content, mime = 'image/svg+xml') => {
      const blob = content instanceof Blob ? content : new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };

    // ====================================================================
    // Wiring
    // ====================================================================

    const groups = {};
    ICONS.forEach(i => {
      groups[i.group] = groups[i.group] || [];
      groups[i.group].push(i);
    });

    const root = document.getElementById('root');
    Object.entries(groups).forEach(([groupName, items]) => {
      const section = document.createElement('section');
      section.className = 'group';
      section.innerHTML = `
        <div class="group__head">
          <h2>${groupName}</h2>
          <span class="group__head__count">${items.length}</span>
          <span class="group__head__line"></span>
        </div>
        <p class="group__desc">${DESCRIPTIONS[groupName] || ''}</p>
        <div class="grid">${items.map(card).join('')}</div>
      `;
      root.appendChild(section);
    });

    // Pojedynczy download
    root.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-dl]');
      if (!btn) return;
      const name = btn.dataset.dl;
      const icon = ICONS.find(i => i.name === name);
      if (!icon) return;
      downloadBlob(`${name}.svg`, buildExportSvg(icon.icon));
    });

    // Download all jako .zip
    document.querySelector('[data-download-all]').addEventListener('click', async () => {
      if (typeof JSZip === 'undefined') {
        // fallback — JSZip nie wczytany; ściągamy pojedynczo z opóźnieniem
        for (const icon of ICONS) {
          downloadBlob(`${icon.name}.svg`, buildExportSvg(icon.icon));
          await new Promise(r => setTimeout(r, 80));
        }
        return;
      }
      const zip = new JSZip();
      ICONS.forEach(icon => zip.file(`${icon.name}.svg`, buildExportSvg(icon.icon)));
      // jako bonus — sprite z wszystkimi <symbol> dla łatwego użycia w HTML
      const sprite = `<svg xmlns="http://www.w3.org/2000/svg" style="display:none">\n${ICONS.map(i => {
        const def = i.icon;
        let inner = '';
        (def.paths || []).forEach(d => inner += `<path d="${d}"/>`);
        (def.circles || []).forEach(c => inner += `<circle cx="${c.cx}" cy="${c.cy}" r="${c.r}"/>`);
        (def.rects || []).forEach(r => inner += `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="${r.rx ?? 0}"/>`);
        return `  <symbol id="${i.name}" viewBox="${def.vb}" fill="none" stroke="currentColor" stroke-width="${def.sw}" stroke-linecap="round" stroke-linejoin="round">${inner}</symbol>`;
      }).join('\n')}\n</svg>\n`;
      zip.file('_sprite.svg', sprite);
      const blob = await zip.generateAsync({ type: 'blob' });
      downloadBlob('schooleo-icons.zip', blob, 'application/zip');
    });
  </script>

</body>
</html>
